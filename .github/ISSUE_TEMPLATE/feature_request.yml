name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: dropdown
    id: component
    attributes:
      label: Component
      options: [Studio, Controller, Node, Catalog, Fabric networking, Docs, Other]
    validations: { required: true }
  - type: textarea
    id: problem
    attributes: { label: Problem to solve }
    validations: { required: true }
  - type: textarea
    id: proposal
    attributes: { label: Proposed solution and alternatives considered }
