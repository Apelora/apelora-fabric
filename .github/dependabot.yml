version: 2
# Patch, minor and security updates whose CI passes are merged automatically
# (dependabot-auto-merge.yml); major versions arrive as their own pull requests and are adopted
# deliberately. A cooldown lets a fresh release settle for a few days before a version update
# is proposed (security updates are not delayed). See docs/development/CI.md.
updates:
  - package-ecosystem: github-actions
    directories: ["/", "/.github/actions/*"]
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    # Minor and patch updates are grouped; every major version arrives as its own pull request
    # and is adopted deliberately (CI must pass; peers such as typescript-eslint may lag).
    groups:
      npm:
        update-types: ["minor", "patch"]
    ignore:
      # TypeScript 7 (native compiler) waits until typescript-eslint declares support for it.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      # The hash and MAC crates share the `digest` traits and only build together (sha2 0.11
      # needs hmac 0.13), so they move in one pull request whatever the version step.
      rustcrypto:
        patterns: ["sha1", "sha2", "hmac", "digest"]
      cargo:
        update-types: ["minor", "patch"]
    ignore:
      # Kept at the version axum uses, so one WebSocket stack is built; moved by hand with axum.
      - dependency-name: "tokio-tungstenite"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
