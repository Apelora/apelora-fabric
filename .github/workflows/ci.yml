name: CI

# Regression gate for every push and pull request: frontend checks, Rust checks, generated-file
# drift, dependency licences and advisories, and the Playwright end-to-end suite (Studio and
# Fabric Console). Pull requests run only the areas they change (scripts/ci/changed-areas.sh);
# pushes to main and manual runs run everything. No secrets and no Incus credentials are
# available here; nothing touches real infrastructure.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Changed areas
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.areas.outputs.frontend }}
      rust: ${{ steps.areas.outputs.rust }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: areas
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
        run: bash scripts/ci/changed-areas.sh "$BASE" | tee -a "$GITHUB_OUTPUT"

  frontend:
    name: Frontend (typecheck, lint, unit, build, generated files)
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Generated files are up to date (JSON Schemas, catalog reference, API client)
        run: |
          npm run schema
          npm run catalog:doc
          npm run generate -w @apelora/api-client
          git diff --exit-code -- packages/assembly-model/schema docs/architecture/CATALOG.md packages/module-catalog/catalog-images.json packages/api-client/src/generated.ts \
            || { echo "::error::Generated files are stale. Run 'npm run schema', 'npm run catalog:doc' and 'npm run api:generate' and commit the result."; exit 1; }

  dependencies:
    name: Dependencies and secrets (licences, advisories, sources, committed secrets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: No secrets in tracked files (private keys, API and join tokens)
        run: bash scripts/security/scan-secrets.sh
      - name: Rust licences, advisories, bans and sources (deny.toml)
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Licences of the npm packages the apps ship
        run: node scripts/licenses/check-npm.mjs
      - name: Known vulnerabilities in the npm packages the apps ship
        run: npm audit --omit=dev --audit-level=high

  rust:
    name: Rust (fmt, clippy, test)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    # Persistence and worker tests run against a real PostgreSQL (fresh database per test).
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: apelora
          POSTGRES_PASSWORD: apelora-ci-only
          POSTGRES_DB: apelora
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U apelora -d apelora"
          --health-interval 2s --health-timeout 2s --health-retries 30
    env:
      DATABASE_URL: postgres://apelora:apelora-ci-only@127.0.0.1:5432/apelora
    steps:
      - uses: actions/checkout@v7
      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace
      - name: Backup and restore drill of Apelora's own database (scripts/ops)
        # The control plane's `token list` applies the migrations to the service database; the
        # test only reads it, writes backups to a temporary directory and drills into scratch
        # databases. The client tools run from the same image as the service.
        env:
          APELORA_PG_CLIENT_IMAGE: postgres:18-alpine
        run: |
          cargo run -q --locked -p apelora-control-plane -- token list >/dev/null
          bash scripts/ops/test-db-backup.sh

  e2e:
    name: End-to-end (Playwright)
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: Run Studio and Fabric Console end-to-end tests
        run: npm run test:e2e
        env:
          CI: "true"
      - name: Upload traces and screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
