name: Mutation testing

# Mutation testing changes the code in small ways and checks that the tests notice. It is slow,
# so it runs weekly, on demand, and on pull requests that touch the authorisation rules (where a
# surviving mutant means a security rule no test protects). See
# docs/development/MUTATION-TESTING.md. No secrets; nothing touches real infrastructure.
on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - "crates/auth/**"
      - "crates/domain/src/access.rs"
      - "crates/domain/src/lifecycle.rs"
      - "crates/telemetry/**"
      - ".cargo/mutants.toml"
      - ".github/workflows/mutation.yml"

permissions:
  contents: read

concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-rules:
    name: Rust authorisation and lifecycle rules (every mutant must be caught)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/bin/cargo-mutants
            target
          key: mutants-${{ hashFiles('Cargo.lock') }}
      - run: command -v cargo-mutants || cargo install cargo-mutants --locked --version 27.1.0
      - name: Authorisation crate
        run: cargo mutants -p apelora-auth --no-shuffle -j 2
      - name: Interactive access and lifecycle rules
        run: cargo mutants -p apelora-domain --no-shuffle -j 2 -f crates/domain/src/access.rs -f crates/domain/src/lifecycle.rs
      - name: Logs and optional traces
        run: cargo mutants -p apelora-telemetry --no-shuffle -j 2 -f crates/telemetry/src/lib.rs --timeout 60
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: mutants-rust
          path: mutants.out
          retention-days: 14

  typescript-rules:
    name: TypeScript model rules (score reported)
    # Only the weekly and manual runs: the score is a trend, not a gate.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx stryker run --reporters clear-text,json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: mutants-typescript
          path: reports/mutation
          retention-days: 14
