[workspace]
resolver = "3"
members = [
  "crates/auth",
  "crates/domain",
  "crates/identity",
  "crates/incus-adapter",
  "crates/maas-adapter",
  "crates/metrics",
  "crates/persistence",
  "crates/telemetry",
  "services/control-plane",
  "services/deployment-worker",
  "services/dns-resolver",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
license = "AGPL-3.0-only"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"
