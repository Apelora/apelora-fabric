# Upstream projects Apelora integrates with (see docs/development/UPSTREAM-INCUS.md).
# Every value here was verified against the upstream repository on the date in `verified`.
# Never edit by guess: use scripts/upstream/prepare-update.sh, which resolves tags to commits.
version: 1
upstreams:
  incus:
    url: https://github.com/lxc/incus
    fork: https://github.com/Apelora/incus
    fork_patch_branch: apelora/7.0
    licence: Apache-2.0
    series: "7.0"
    pinned_tag: v7.0.2
    pinned_commit: 01f81e5e607bbb5818410318e4b3496ad1820824
    latest_feature_release: v7.5.1
    support: LTS until June 2031 (bug and security fixes for two years, then security only)
    host_minimums: Linux kernel 6.12, cgroup v2, QEMU 8.2, LXC 6.0, nftables 1.0
    required_api_extensions: instance_create_start, operation_wait; instance_oci for OCI (checked by preflight against a real 7.0.1 server)
    tested_with: "REAL INCUS TESTED 2026-10-20 with 7.0.1 (lts-7.0 packages, Debian 13 arm64, two- then three-member cluster, docs/development/TEST-CLUSTER.md): inventory, preflight, LXC/OCI/VM lifecycle, join tokens, placement scriptlet, evacuation, member failure, OVN networks, ACLs and load balancers; 7.0.2 itself not yet run"
    upgrade_policy: update pull request only; human review; no automatic production upgrades
    verified: 2026-10-20
