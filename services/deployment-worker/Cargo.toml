[package]
name = "apelora-deployment-worker"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# The metrics listener (GET /metrics, GET /healthz): the same HTTP stack the control plane uses,
# already in the tree; HTTP/1 only.
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio"] }
apelora-domain = { version = "0.0.0", path = "../../crates/domain" }
apelora-incus-adapter = { version = "0.0.0", path = "../../crates/incus-adapter" }
apelora-metrics = { version = "0.0.0", path = "../../crates/metrics" }
apelora-persistence = { version = "0.0.0", path = "../../crates/persistence" }
serde = { version = "1.0.229", features = ["derive"] }
# Alert webhooks (docs/design/alerts.md §2.4): HMAC-SHA256 signatures. Both already in the tree
# (through sqlx), MIT OR Apache-2.0; hmac 0.12 pairs with sha2 0.10.
hmac = "0.12.1"
sha2 = "0.10.9"
# Alert webhooks over HTTPS: the same client, version and features the control plane and the
# Incus adapter use (rustls, TLS verified against the system trust store).
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
serde_json = "1.0.154"
time = { version = "0.3.47", features = ["formatting", "parsing"] }
# `process`: the fence probe runs the system `ssh` client (ADR 0013).
tokio = { version = "1.54.0", features = ["macros", "rt-multi-thread", "signal", "time", "net", "sync", "process"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
uuid = "1.26.1"

[dev-dependencies]
# An unreachable Incus for the alert evaluator's tests (as the control plane's tests use it).
apelora-incus-adapter = { path = "../../crates/incus-adapter", features = ["test-util"] }
# A local HTTPS receiver for the webhook tests (the versions the control plane's tests use).
rcgen = "0.14.7"
rustls = { version = "0.23.46", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["aws_lc_rs"] }
tokio = { version = "1.54.0", features = ["io-util"] }
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "postgres", "macros", "migrate"] }
