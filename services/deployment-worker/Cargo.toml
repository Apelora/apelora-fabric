[package]
name = "apelora-deployment-worker"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
apelora-domain = { version = "0.0.0", path = "../../crates/domain" }
apelora-incus-adapter = { version = "0.0.0", path = "../../crates/incus-adapter" }
apelora-persistence = { version = "0.0.0", path = "../../crates/persistence" }
serde_json = "1.0.154"
tokio = { version = "1.54.0", features = ["macros", "rt-multi-thread", "signal", "time"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
uuid = "1.26.1"

[dev-dependencies]
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "postgres", "macros", "migrate"] }
