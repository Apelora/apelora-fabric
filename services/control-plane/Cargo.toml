[package]
name = "apelora-control-plane"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
apelora-domain = { version = "0.0.0", path = "../../crates/domain" }
apelora-incus-adapter = { version = "0.0.0", path = "../../crates/incus-adapter" }
apelora-persistence = { version = "0.0.0", path = "../../crates/persistence" }
axum = "0.8.9"
jiff = "0.2.38"
serde_json = "1.0.154"
time = "0.3.45"
tokio = { version = "1.54.0", features = ["macros", "rt-multi-thread", "net", "signal"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
uuid = "1.26.1"

[dev-dependencies]
apelora-incus-adapter = { path = "../../crates/incus-adapter", features = ["test-util"] }
http-body-util = "0.1.5"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "postgres", "macros", "migrate"] }
tokio = { version = "1.54.0", features = ["macros", "rt-multi-thread", "net"] }
tower = { version = "0.5.3", features = ["util"] }
