[package]
name = "apelora-control-plane"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
apelora-auth = { version = "0.0.0", path = "../../crates/auth", features = ["utoipa"] }
apelora-domain = { version = "0.0.0", path = "../../crates/domain", features = ["utoipa"] }
apelora-identity = { version = "0.0.0", path = "../../crates/identity" }
apelora-incus-adapter = { version = "0.0.0", path = "../../crates/incus-adapter" }
apelora-maas-adapter = { version = "0.0.0", path = "../../crates/maas-adapter" }
apelora-metrics = { version = "0.0.0", path = "../../crates/metrics" }
apelora-persistence = { version = "0.0.0", path = "../../crates/persistence" }
argon2 = "0.6.0"
futures-util = { version = "0.3.32", default-features = false, features = ["std"] }
axum = { version = "0.8.9", features = ["ws"] }
getrandom = "0.4.3"
jiff = "0.2.38"
# Directory sign-in over LDAP with TLS (ADR 0007). MIT OR Apache-2.0. Only its rustls backend
# (aws-lc-rs, as the Incus adapter uses); no native TLS, Kerberos or NTLM.
ldap3 = { version = "0.12.1", default-features = false, features = ["tls-rustls-aws-lc-rs"] }
# The same TLS stack and versions as the Incus adapter: the directory's CA (PEM) or the system's
# trusted roots (rustls-native-certs, already in the tree through reqwest).
rustls = { version = "0.23.46", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
rustls-native-certs = "0.8.5"
# TLS for the API itself (APELORA_TLS_CERT/KEY) uses the same rustls stack.
rustls-pki-types = { version = "1.15.1", features = ["std"] }
# Probes image mirrors (ADR 0010). Already in the tree (incus-adapter, identity): same version and
# features, TLS verified against the system trust store.
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.0"
time = { version = "0.3.47", features = ["formatting", "parsing"] }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["aws_lc_rs"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
# Parses directory URLs; already in the tree (MIT OR Apache-2.0).
url = "2.5.8"
utoipa = { version = "5.5.0", features = ["axum_extras", "uuid"] }
uuid = "1.26.1"

[dev-dependencies]
base64 = "0.22.1"
futures-util = { version = "0.3.32", default-features = false, features = ["sink", "std"] }
tokio-tungstenite = { version = "0.29.0", default-features = false, features = ["connect"] }
jsonwebtoken = { version = "11", default-features = false, features = ["aws_lc_rs", "use_pem"] }
rcgen = "0.14.10"
apelora-deployment-worker = { path = "../deployment-worker" }
apelora-incus-adapter = { path = "../../crates/incus-adapter", features = ["test-util"] }
http-body-util = "0.1.5"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "postgres", "macros", "migrate"] }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "net"] }
# A local TLS server for the directory TLS tests (same version as the Incus adapter).
tokio-rustls = { version = "0.26.6", default-features = false, features = ["aws_lc_rs"] }
tower = { version = "0.5.3", features = ["util"] }
