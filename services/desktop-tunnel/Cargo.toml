# SPDX-License-Identifier: AGPL-3.0-only
[package]
name = "apelora-desktop-tunnel"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "apelora-desktop-tunnel"
path = "src/main.rs"

[lints]
workspace = true

# Every dependency is already in the tree through the control plane and the Incus adapter, at the
# same versions; nothing new is downloaded or licensed.
[dependencies]
futures-util = { version = "0.3.32", default-features = false, features = ["sink", "std"] }
rustls = { version = "0.23.46", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
rustls-pki-types = { version = "1.15.1", features = ["std"] }
# The operating system's trust store for the control plane's certificate (MIT OR Apache-2.0;
# already in the tree through reqwest).
rustls-platform-verifier = "0.7.1"
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["macros", "rt", "net", "io-util", "io-std", "time"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["aws_lc_rs"] }
tokio-tungstenite = { version = "0.29.0", default-features = false, features = ["handshake"] }
