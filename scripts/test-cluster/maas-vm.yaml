# SPDX-License-Identifier: AGPL-3.0-only
# Lima VM that runs a throwaway MAAS (region and rack controller, its test database) so the MAAS
# adapter can be checked against the real API (scripts/test-cluster/maas.sh,
# docs/design/provisioner-maas.md). It manages no real hardware: the machines in it are records
# created over the API with manual power. Throwaway only; the admin password and the API key are
# generated by maas.sh and kept under ~/.config/apelora/test-cluster, never in the repository.
minimumLimaVersion: 2.0.0
base:
  - template:_images/ubuntu-24.04
vmType: vz
cpus: 4
memory: 6GiB
disk: 40GiB
mounts: []
containerd:
  system: false
  user: false
# lima0 (vzNAT): an address the host reaches MAAS on, without port forwarding.
networks:
  - vzNAT: true
portForwards:
  # Forward nothing. A rule for 0.0.0.0 alone does not match services bound to the guest's
  # loopback (the lab's control plane and PostgreSQL on 127.0.0.1), and Lima's built-in last
  # rule would forward those to the host's own 8080 and 5432.
  - guestIP: 0.0.0.0
    guestIPMustBeZero: false
    guestPortRange: [1, 65535]
    proto: any
    ignore: true
  - guestIP: 127.0.0.1
    guestPortRange: [1, 65535]
    proto: any
    ignore: true
