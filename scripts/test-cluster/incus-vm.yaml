# SPDX-License-Identifier: AGPL-3.0-only
# Lima VM for the disposable Incus test cluster (docs/development/TEST-CLUSTER.md).
# Throwaway only: never point it at real workloads. Started and configured by up.sh.
minimumLimaVersion: 2.0.0

# Debian 13: kernel 6.12, the Incus 7.0 minimum. The image list pins sha512 digests.
base:
  - template:_images/debian-13

vmType: vz
# Lets Incus run virtual machines inside this VM (Apple M3 or later, macOS 15 or later).
nestedVirtualization: true
cpus: 4
memory: 8GiB
disk: 40GiB

# No host folders are shared with the test VM.
mounts: []
containerd:
  system: false
  user: false

# A host-reachable address for the Incus API (no port forwarding needed).
networks:
  - vzNAT: true
portForwards:
  - guestIP: 0.0.0.0
    guestPortRange: [1, 65535]
    ignore: true

provision:
  - mode: system
    script: |
      #!/bin/bash
      set -euo pipefail
      command -v incus >/dev/null && exit 0
      export DEBIAN_FRONTEND=noninteractive
      apt-get update -q
      apt-get install -yq curl gpg btrfs-progs
      # Incus 7.0 LTS from the packaging repository named in Incus's installation guide.
      # Refuse a signing key whose fingerprint differs from the published one.
      install -d -m 0755 /etc/apt/keyrings
      curl -fsSL https://pkgs.zabbly.com/key.asc -o /etc/apt/keyrings/zabbly.asc
      want=4EFC590696CB15B87C73A3AD82CC8797C838DCFD
      got=$(gpg --show-keys --with-colons /etc/apt/keyrings/zabbly.asc | awk -F: '/^fpr/ {print $10; exit}')
      [ "$got" = "$want" ] || { echo "unexpected package signing key: $got" >&2; rm -f /etc/apt/keyrings/zabbly.asc; exit 1; }
      cat >/etc/apt/sources.list.d/zabbly-incus-lts-7.0.sources <<EOF
      Enabled: yes
      Types: deb
      URIs: https://pkgs.zabbly.com/incus/lts-7.0
      Suites: $(. /etc/os-release && echo "$VERSION_CODENAME")
      Components: main
      Architectures: $(dpkg --print-architecture)
      Signed-By: /etc/apt/keyrings/zabbly.asc
      EOF
      apt-get update -q
      apt-get install -yq incus
