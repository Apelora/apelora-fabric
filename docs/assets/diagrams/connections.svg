    .tl { stroke: #0F8C80; stroke-width: 2; fill: none; }
    .bl { stroke: #2F6FD6; stroke-width: 2; fill: none; stroke-dasharray: 7 5; }
    .al { stroke: #D98A1C; stroke-width: 2; fill: none; stroke-dasharray: 2 5; stroke-linecap: round; }
    .dash { stroke-dasharray: 6 5; }
  </style>
