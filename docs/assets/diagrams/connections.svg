<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 950" width="1200" height="950" role="img" aria-labelledby="cn-title cn-desc" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="cn-title">Connections between the layers</title>
  <desc id="cn-desc">Browsers reach only the Apelora API and the identity provider. The control plane reaches PostgreSQL, the identity provider, a directory and every sector&#x27;s Incus API over mutual TLS; the deployment worker reaches PostgreSQL and the Incus API. Inside a sector, physical servers run Incus and ovn-controller, talk to each other for the cluster database and migrations, carry application traffic over a Geneve overlay, reach the OVN databases and, for the shared pool, a SAN. Clients reach applications on published addresses. Numbers match the connections table.</desc>
  <!-- SPDX-License-Identifier: AGPL-3.0-only -->
  <defs>
    <linearGradient id="g-card" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#F3F4F6"/></linearGradient>
    <linearGradient id="g-teal" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E6FAF7"/><stop offset="1" stop-color="#CDEFEA"/></linearGradient>
    <linearGradient id="g-blue" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#EEF4FE"/><stop offset="1" stop-color="#DCE8FC"/></linearGradient>
    <linearGradient id="g-amber" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFF7EB"/><stop offset="1" stop-color="#FDEBCF"/></linearGradient>
    <linearGradient id="g-violet" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F4F1FE"/><stop offset="1" stop-color="#E7E1FC"/></linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8C959F"/></marker>
  </defs>
