<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-labelledby="dc-title dc-desc" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="dc-title">From a design to running instances</title>
  <desc id="dc-desc">In the Studio, a gateway connects to a web module (NGINX) with three replicas, which connects to a database module (PostgreSQL) that keeps a 20 GiB volume. Apelora plans the deployment first: three instances, the web replicas, named shop-web, shop-web-r2 and shop-web-r3, each on a different server and all on the application's OVN network. The gateway does not run as an instance: it publishes web's service address on port 80 to the outside. PostgreSQL has no runtime yet, so the database and its volume, drawn dashed on server 1, stay in the design for now; once it can run, its volume lives in its server's pool and only the web-to-database connection is allowed to reach it.</desc>
  <!-- SPDX-License-Identifier: AGPL-3.0-only -->
  <defs>
    <linearGradient id="dc-amber" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFF7EB"/><stop offset="1" stop-color="#FDEBCF"/></linearGradient>
    <linearGradient id="dc-amber-strong" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F2A93B"/><stop offset="1" stop-color="#D98A1C"/></linearGradient>
    <linearGradient id="dc-teal-strong" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#19B3A3"/><stop offset="1" stop-color="#0F8C80"/></linearGradient>
    <linearGradient id="dc-green-body" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#3FA56B"/><stop offset="0.2" stop-color="#7CCB9B"/><stop offset="0.55" stop-color="#4DB37A"/><stop offset="0.85" stop-color="#6FC28F"/><stop offset="1" stop-color="#2F8A57"/></linearGradient>
    <marker id="dc-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#8C959F"/></marker>
    <marker id="dc-arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#2F6FD6"/></marker>
    <g id="dc-lock">
      <path d="M-4 -2 V-5 A4 4 0 0 1 4 -5 V-2" fill="none" stroke="#2F6FD6" stroke-width="1.6"/>
      <rect x="-6" y="-2" width="12" height="9" rx="2" fill="#2F6FD6"/>
    </g>
  </defs>
  <style>
    .t { fill: #1F2328; }
    .m { fill: #57606A; }
    .w { fill: #FFFFFF; }
    .h1 { font-size: 26px; font-weight: 700; }
    .h2 { font-size: 15px; font-weight: 700; }
    .b { font-size: 13px; }
    .s { font-size: 11.5px; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11.5px; }
    .cable { stroke: #6B8FC9; stroke-width: 2; fill: none; }
    .rule { stroke: #2F6FD6; stroke-width: 1.6; fill: none; }
  </style>

  <rect width="1200" height="600" fill="#FFFFFF"/>
  <text x="600" y="46" text-anchor="middle" class="t h1">From a design to running instances</text>

  <!-- 1. The design -->
  <g id="dc-design">
    <text x="40" y="96" class="t h2">1. Design in Apelora Studio</text>
    <rect x="40" y="110" width="420" height="380" rx="12" fill="#F7F7F8" stroke="#D9DCE1"/>
    <circle cx="60" cy="128" r="4" fill="#D0D4DA"/><circle cx="74" cy="128" r="4" fill="#D0D4DA"/><circle cx="88" cy="128" r="4" fill="#D0D4DA"/>
    <text x="106" y="132" class="m s">shop</text>

    <!-- modules -->
    <g id="dc-node-gateway">
      <rect x="62" y="240" width="104" height="80" rx="8" fill="#FFFFFF" stroke="#D9DCE1"/>
      <path d="M62 262 V248 A8 8 0 0 1 70 240 H158 A8 8 0 0 1 166 248 V262 Z" fill="#F6D9DF"/>
      <text x="72" y="256" class="t s">gateway</text>
      <text x="114" y="300" text-anchor="middle" class="m s">Gateway</text>
    </g>
    <g id="dc-node-web">
      <rect x="198" y="240" width="104" height="80" rx="8" fill="#FFFFFF" stroke="#D9DCE1"/>
      <path d="M198 262 V248 A8 8 0 0 1 206 240 H294 A8 8 0 0 1 302 248 V262 Z" fill="#DCE8FA"/>
      <text x="208" y="256" class="t s">web</text>
      <text x="250" y="300" text-anchor="middle" class="m s">NGINX</text>
      <rect x="276" y="230" width="30" height="18" rx="9" fill="#1F2328"/>
      <text x="291" y="243" text-anchor="middle" class="w s">×3</text>
    </g>
    <g id="dc-node-db">
      <rect x="334" y="240" width="104" height="80" rx="8" fill="#FFFFFF" stroke="#D9DCE1"/>
      <path d="M334 262 V248 A8 8 0 0 1 342 240 H430 A8 8 0 0 1 438 248 V262 Z" fill="#E7DDF6"/>
      <text x="344" y="256" class="t s">db</text>
      <text x="386" y="300" text-anchor="middle" class="m s">PostgreSQL</text>
    </g>
    <path class="cable" d="M166 280 C182 280 182 280 198 280"/>
    <path class="cable" d="M302 280 C318 280 318 280 334 280"/>
    <circle cx="166" cy="280" r="3.5" fill="#6B8FC9"/><circle cx="198" cy="280" r="3.5" fill="#6B8FC9"/>
    <circle cx="302" cy="280" r="3.5" fill="#6B8FC9"/><circle cx="334" cy="280" r="3.5" fill="#6B8FC9"/>
    <text x="182" y="272" text-anchor="middle" class="m s">http</text>
    <text x="318" y="272" text-anchor="middle" class="m s">sql</text>
    <!-- volume on db -->
    <g id="dc-design-volume">
      <rect x="361" y="340" width="50" height="22" fill="url(#dc-green-body)"/>
      <ellipse cx="386" cy="362" rx="25" ry="5" fill="#2F8A57"/>
      <ellipse cx="386" cy="340" rx="25" ry="5" fill="#9BDAB4"/>
      <path d="M386 320 V335" stroke="#8C959F" stroke-width="1.2"/>
      <text x="386" y="384" text-anchor="middle" class="m s">data, 20 GiB</text>
    </g>
    <text x="62" y="432" class="m b">Modules with typed ports. Cables are</text>
    <text x="62" y="450" class="m b">the only connections the application gets.</text>
  </g>

  <!-- 2. Plan and deploy -->
  <g id="dc-plan">
    <path d="M472 300 H596" stroke="#8C959F" stroke-width="2" marker-end="url(#dc-arrow)"/>
    <rect x="478" y="248" width="112" height="38" rx="19" fill="url(#dc-teal-strong)"/>
    <text x="534" y="272" text-anchor="middle" class="w h2">2. Deploy</text>
    <text x="534" y="324" text-anchor="middle" class="m s">plan first:</text>
    <text x="534" y="340" text-anchor="middle" class="m s">3 instances (web),</text>
    <text x="534" y="356" text-anchor="middle" class="m s">web published on 80;</text>
    <text x="534" y="372" text-anchor="middle" class="m s">db design-only today</text>
  </g>

  <!-- 3. The cluster -->
  <g id="dc-cluster">
    <text x="610" y="96" class="t h2">3. Running on the Incus cluster</text>
    <!-- service address -->
    <rect x="760" y="110" width="250" height="34" rx="17" fill="#FFFFFF" stroke="#2F6FD6" stroke-width="1.6"/>
    <text x="885" y="132" text-anchor="middle" class="t s">service address for web: 198.18.100.1</text>

    <!-- application network -->
    <rect x="610" y="164" width="550" height="300" rx="16" fill="#EEF4FE" stroke="#2F6FD6" stroke-width="1.6" stroke-dasharray="7 5"/>
    <text x="626" y="453" class="s" fill="#2F6FD6" font-weight="700">network shop (OVN): traffic no cable allows is rejected</text>

    <g id="dc-server-1">
      <rect x="626" y="200" width="160" height="230" rx="10" fill="url(#dc-amber)" stroke="#EDC27E"/>
      <rect x="626" y="200" width="160" height="28" rx="10" fill="url(#dc-amber-strong)"/>
      <rect x="626" y="218" width="160" height="10" fill="#D98A1C"/>
      <text x="706" y="219" text-anchor="middle" class="w h2">Server 1</text>
      <rect x="642" y="240" width="128" height="34" rx="6" fill="#FFFFFF" stroke="#E2C08A"/>
      <text x="706" y="262" text-anchor="middle" class="mono t">shop-web</text>
      <rect x="642" y="296" width="128" height="34" rx="6" fill="#FFFFFF" stroke="#B9C0C9" stroke-dasharray="4 3"/>
      <text x="706" y="318" text-anchor="middle" class="mono m">shop-db</text>
      <path d="M706 330 V343" stroke="#8C959F" stroke-width="1.2" stroke-dasharray="3 2"/>
      <g opacity="0.45">
        <rect x="681" y="348" width="50" height="22" fill="url(#dc-green-body)"/>
        <ellipse cx="706" cy="370" rx="25" ry="5" fill="#2F8A57"/>
        <ellipse cx="706" cy="348" rx="25" ry="5" fill="#9BDAB4"/>
      </g>
      <text x="740" y="364" class="m s">data</text>
      <text x="706" y="400" text-anchor="middle" class="m s">later: no runtime yet</text>
    </g>
    <g id="dc-server-2">
      <rect x="806" y="200" width="160" height="230" rx="10" fill="url(#dc-amber)" stroke="#EDC27E"/>
      <rect x="806" y="200" width="160" height="28" rx="10" fill="url(#dc-amber-strong)"/>
      <rect x="806" y="218" width="160" height="10" fill="#D98A1C"/>
      <text x="886" y="219" text-anchor="middle" class="w h2">Server 2</text>
      <rect x="822" y="240" width="128" height="34" rx="6" fill="#FFFFFF" stroke="#E2C08A"/>
      <text x="886" y="262" text-anchor="middle" class="mono t">shop-web-r2</text>
    </g>
    <g id="dc-server-3">
      <rect x="986" y="200" width="160" height="230" rx="10" fill="url(#dc-amber)" stroke="#EDC27E"/>
      <rect x="986" y="200" width="160" height="28" rx="10" fill="url(#dc-amber-strong)"/>
      <rect x="986" y="218" width="160" height="10" fill="#D98A1C"/>
      <text x="1066" y="219" text-anchor="middle" class="w h2">Server 3</text>
      <rect x="1002" y="240" width="128" height="34" rx="6" fill="#FFFFFF" stroke="#E2C08A"/>
      <text x="1066" y="262" text-anchor="middle" class="mono t">shop-web-r3</text>
    </g>

    <!-- the service address balances over the replicas -->
    <path class="rule" d="M800 144 V156 H706 V240" marker-end="url(#dc-arrow-blue)"/>
    <path class="rule" d="M886 144 V240" marker-end="url(#dc-arrow-blue)"/>
    <path class="rule" d="M972 144 V156 H1066 V240" marker-end="url(#dc-arrow-blue)"/>
    <!-- the gateway publishes web's service address to the outside; web to db is an access rule once db can run -->
    <path class="rule" d="M1188 127 H1014" marker-end="url(#dc-arrow-blue)"/>
    <use href="#dc-lock" x="1100" y="125"/>
    <text x="1100" y="104" text-anchor="middle" class="s" fill="#2F6FD6">from outside, port 80</text>
    <path class="rule" d="M706 274 V296" stroke-dasharray="4 3" marker-end="url(#dc-arrow-blue)"/>
    <use href="#dc-lock" x="724" y="288"/>
  </g>

  <!-- Legend -->
  <g id="dc-legend">
    <use href="#dc-lock" x="618" y="497"/>
    <text x="632" y="502" class="m b">The gateway publishes web on port 80; web to db is allowed on 5432.</text>
    <text x="610" y="526" class="m b">Replicas run on different servers, and a lost one is replaced. Dashed:</text>
    <text x="610" y="544" class="m b">design-only today (PostgreSQL has no runtime; its volume would stay</text>
    <text x="610" y="562" class="m b">in its server's pool and outlive the instance).</text>
  </g>
</svg>
