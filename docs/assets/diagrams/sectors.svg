<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 740" width="1200" height="740" role="img" aria-labelledby="sc-title sc-desc" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="sc-title">Sectors linked into one fabric</title>
  <desc id="sc-desc">One Apelora control plane manages several sectors. Each sector is one Incus cluster of up to 50 servers in one site, with its own cluster database, OVN and storage pools. Sectors 1 and 2 share site A and are joined by a network link; sector 3 is in site B and is joined to sector 2 by data and recovery links. Every sector has a management link to the control plane.</desc>
