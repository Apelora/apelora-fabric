    <text x="146" y="663" class="t b" font-weight="700">Data and recovery links</text><text x="330" y="663" class="m b">instances and volumes copied or moved between sectors as jobs; backups kept in another sector</text>
    <text x="600" y="712" text-anchor="middle" class="m s">An application lives in one sector. 20 sectors of 50 servers is 1,000 servers under one Console (estimate); each sector keeps a fault inside one rack.</text>
