<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 990" width="1200" height="990" role="img" aria-labelledby="pl-title pl-desc" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="pl-title">Apelora on Incus, layer by layer</title>
  <desc id="pl-desc">People use Apelora Studio and the Fabric Console. Both talk to the Apelora control plane: a REST API, PostgreSQL and the deployment worker. The control plane drives an Incus cluster over the Incus REST API. Each server in the cluster runs the instances of modules: system containers by default, OCI application containers (NGINX) and virtual machines where a module's class says so. A stateless module's replicas are named shop-web, shop-web-r2 and shop-web-r3 and run on different servers. Each server keeps root disks and volumes in its local pool and backup copies in a backup pool; a shared pool, clustered LVM on a SAN reached by every server, runs in the lab but Apelora places nothing on it yet. OVN gives each application its own network with access rules and service addresses. Underneath are the physical servers and their network; in the lab, Lima VMs stand in for them.</desc>
  <!-- SPDX-License-Identifier: AGPL-3.0-only -->
  <defs>
    <linearGradient id="pl-teal" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E6FAF7"/><stop offset="1" stop-color="#CDEFEA"/></linearGradient>
    <linearGradient id="pl-teal-strong" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#19B3A3"/><stop offset="1" stop-color="#0F8C80"/></linearGradient>
    <linearGradient id="pl-amber" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFF7EB"/><stop offset="1" stop-color="#FDEBCF"/></linearGradient>
    <linearGradient id="pl-amber-strong" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F2A93B"/><stop offset="1" stop-color="#D98A1C"/></linearGradient>
    <linearGradient id="pl-blue" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4C8DF0"/><stop offset="1" stop-color="#2F6FD6"/></linearGradient>
    <linearGradient id="pl-green-body" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#3FA56B"/><stop offset="0.2" stop-color="#7CCB9B"/><stop offset="0.55" stop-color="#4DB37A"/><stop offset="0.85" stop-color="#6FC28F"/><stop offset="1" stop-color="#2F8A57"/></linearGradient>
    <linearGradient id="pl-card" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#F3F4F6"/></linearGradient>
    <linearGradient id="pl-metal" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#C9CED6"/><stop offset="1" stop-color="#9AA2AE"/></linearGradient>
    <radialGradient id="pl-floor" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#000" stop-opacity="0.18"/><stop offset="0.7" stop-color="#000" stop-opacity="0.06"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
    <g id="pl-person">
      <circle cx="0" cy="-22" r="13" fill="#5B6573"/>
      <path d="M-24 18 C-24 -2 -12 -6 0 -6 C12 -6 24 -2 24 18 Z" fill="#5B6573"/>
    </g>
  </defs>
  <style>
    .t { fill: #1F2328; }
    .m { fill: #57606A; }
    .w { fill: #FFFFFF; }
    .h1 { font-size: 26px; font-weight: 700; }
    .h2 { font-size: 15px; font-weight: 700; }
    .b { font-size: 13px; }
    .s { font-size: 11.5px; }
    .line { stroke: #8C959F; stroke-width: 1.5; fill: none; }
  </style>

  <rect width="1200" height="990" fill="#FFFFFF"/>
  <text x="600" y="46" text-anchor="middle" class="t h1">Apelora on Incus, layer by layer</text>

  <!-- People -->
  <g id="pl-people">
    <use href="#pl-person" x="300" y="112"/>
    <text x="300" y="152" text-anchor="middle" class="t b">Designer</text>
    <use href="#pl-person" x="600" y="112"/>
    <text x="600" y="152" text-anchor="middle" class="t b">Operator</text>
    <use href="#pl-person" x="900" y="112"/>
    <text x="900" y="152" text-anchor="middle" class="t b">Administrator</text>
  </g>

  <!-- Lines from people to the two user interfaces -->
  <path class="line" d="M300 160 V182 H380 V200"/>
  <path class="line" d="M600 160 V182 H380"/>
  <path class="line" d="M600 182 H820 V200"/>
  <path class="line" d="M900 160 V182 H820"/>

  <!-- User interfaces -->
  <g id="pl-uis">
    <rect x="200" y="200" width="360" height="68" rx="10" fill="url(#pl-teal)" stroke="#5CC8BB"/>
    <text x="380" y="228" text-anchor="middle" class="t h2">Apelora Studio</text>
    <text x="380" y="250" text-anchor="middle" class="m b">Design applications from modules</text>
    <rect x="640" y="200" width="360" height="68" rx="10" fill="url(#pl-teal)" stroke="#5CC8BB"/>
    <text x="820" y="228" text-anchor="middle" class="t h2">Fabric Console</text>
    <text x="820" y="250" text-anchor="middle" class="m b">Run servers, members, volumes and access</text>
  </g>

  <!-- To the control plane -->
  <path class="line" d="M380 268 V318"/>
  <path class="line" d="M820 268 V318"/>
  <text x="600" y="300" text-anchor="middle" class="m s">HTTPS /api/v1</text>

  <!-- Control plane -->
  <g id="pl-control-plane">
    <rect x="120" y="318" width="960" height="128" rx="12" fill="url(#pl-teal-strong)"/>
    <text x="144" y="344" class="w h2">Apelora control plane</text>
    <text x="1056" y="344" text-anchor="end" class="w s" fill-opacity="0.9">applications, desired state, connections, replicas, health</text>
    <rect x="144" y="360" width="290" height="68" rx="8" fill="url(#pl-card)"/>
    <text x="289" y="388" text-anchor="middle" class="t h2">REST API</text>
    <text x="289" y="409" text-anchor="middle" class="m s">plans, deployments, roles, audit</text>
    <rect x="455" y="360" width="290" height="68" rx="8" fill="url(#pl-card)"/>
    <text x="600" y="388" text-anchor="middle" class="t h2">PostgreSQL</text>
    <text x="600" y="409" text-anchor="middle" class="m s">designs, jobs, volumes, audit log</text>
    <rect x="766" y="360" width="290" height="68" rx="8" fill="url(#pl-card)"/>
    <text x="911" y="388" text-anchor="middle" class="t h2">Deployment worker</text>
    <text x="911" y="409" text-anchor="middle" class="m s">jobs, network sync, health, recovery</text>
  </g>

  <path class="line" d="M600 446 V484"/>
  <text x="612" y="470" class="m s">Incus REST API, mutual TLS</text>

  <!-- Incus cluster -->
  <g id="pl-cluster">
    <rect x="120" y="484" width="960" height="346" rx="12" fill="#FBFBFC" stroke="#B9C0C9" stroke-dasharray="6 5"/>
    <text x="144" y="510" class="t h2">Incus cluster</text>
    <text x="1056" y="510" text-anchor="end" class="m s">membership, placement; system containers by default, OCI containers and VMs where a class says</text>

    <g id="pl-server-1">
      <rect x="144" y="524" width="290" height="186" rx="10" fill="url(#pl-amber)" stroke="#EDC27E"/>
      <rect x="144" y="524" width="290" height="30" rx="10" fill="url(#pl-amber-strong)"/>
      <rect x="144" y="544" width="290" height="10" fill="#D98A1C"/>
      <text x="289" y="544" text-anchor="middle" class="w h2">Server 1</text>
      <rect x="162" y="568" width="78" height="54" rx="6" fill="#FFFFFF" stroke="#E2C08A"/>
      <text x="201" y="586" text-anchor="middle" class="t s">shop-web</text>
      <text x="201" y="602" text-anchor="middle" class="m s">OCI</text>
      <text x="201" y="615" text-anchor="middle" class="m s">container</text>
      <rect x="250" y="568" width="78" height="54" rx="6" fill="#FFFFFF" stroke="#E2C08A"/>
      <text x="289" y="586" text-anchor="middle" class="t s">shop-db</text>
      <text x="289" y="602" text-anchor="middle" class="m s">system</text>
      <text x="289" y="615" text-anchor="middle" class="m s">container</text>
      <rect x="338" y="568" width="78" height="54" rx="6" fill="#FFFFFF" stroke="#E2C08A"/>
      <text x="377" y="586" text-anchor="middle" class="t s">shop-build</text>
      <text x="377" y="602" text-anchor="middle" class="m s">virtual</text>
      <text x="377" y="615" text-anchor="middle" class="m s">machine</text>
      <rect x="162" y="642" width="150" height="38" fill="url(#pl-green-body)"/>
      <ellipse cx="237" cy="680" rx="75" ry="8" fill="#2F8A57"/>
      <ellipse cx="237" cy="642" rx="75" ry="8" fill="#9BDAB4"/>
      <text x="237" y="667" text-anchor="middle" class="w s">local: disks, volumes</text>
      <rect x="328" y="642" width="88" height="38" fill="url(#pl-green-body)" fill-opacity="0.75"/>
      <ellipse cx="372" cy="680" rx="44" ry="8" fill="#2F8A57" fill-opacity="0.75"/>
      <ellipse cx="372" cy="642" rx="44" ry="8" fill="#9BDAB4"/>
      <text x="372" y="667" text-anchor="middle" class="w s">backup</text>
    </g>
    <g id="pl-server-2">
      <rect x="455" y="524" width="290" height="186" rx="10" fill="url(#pl-amber)" stroke="#EDC27E"/>
      <rect x="455" y="524" width="290" height="30" rx="10" fill="url(#pl-amber-strong)"/>
      <rect x="455" y="544" width="290" height="10" fill="#D98A1C"/>
      <text x="600" y="544" text-anchor="middle" class="w h2">Server 2</text>
      <rect x="473" y="568" width="78" height="54" rx="6" fill="#FFFFFF" stroke="#E2C08A"/>
      <text x="512" y="586" text-anchor="middle" class="t s">shop-web-r2</text>
      <text x="512" y="602" text-anchor="middle" class="m s">OCI</text>
      <text x="512" y="615" text-anchor="middle" class="m s">container</text>
      <rect x="561" y="568" width="78" height="54" rx="6" fill="#FFFFFF" stroke="#E2C08A"/>
      <text x="600" y="586" text-anchor="middle" class="t s">shop-cache</text>
      <text x="600" y="602" text-anchor="middle" class="m s">system</text>
      <text x="600" y="615" text-anchor="middle" class="m s">container</text>
      <rect x="649" y="568" width="78" height="54" rx="6" fill="#FFFFFF" stroke="#E2C08A" stroke-dasharray="4 3"/>
      <text x="688" y="599" text-anchor="middle" class="m s">free</text>
      <rect x="473" y="642" width="150" height="38" fill="url(#pl-green-body)"/>
      <ellipse cx="548" cy="680" rx="75" ry="8" fill="#2F8A57"/>
      <ellipse cx="548" cy="642" rx="75" ry="8" fill="#9BDAB4"/>
      <text x="548" y="667" text-anchor="middle" class="w s">local: disks, volumes</text>
      <rect x="639" y="642" width="88" height="38" fill="url(#pl-green-body)" fill-opacity="0.75"/>
      <ellipse cx="683" cy="680" rx="44" ry="8" fill="#2F8A57" fill-opacity="0.75"/>
      <ellipse cx="683" cy="642" rx="44" ry="8" fill="#9BDAB4"/>
      <text x="683" y="667" text-anchor="middle" class="w s">backup</text>
    </g>
    <g id="pl-server-3">
      <rect x="766" y="524" width="290" height="186" rx="10" fill="url(#pl-amber)" stroke="#EDC27E"/>
      <rect x="766" y="524" width="290" height="30" rx="10" fill="url(#pl-amber-strong)"/>
      <rect x="766" y="544" width="290" height="10" fill="#D98A1C"/>
      <text x="911" y="544" text-anchor="middle" class="w h2">Server 3</text>
      <rect x="784" y="568" width="78" height="54" rx="6" fill="#FFFFFF" stroke="#E2C08A"/>
      <text x="823" y="586" text-anchor="middle" class="t s">shop-web-r3</text>
      <text x="823" y="602" text-anchor="middle" class="m s">OCI</text>
      <text x="823" y="615" text-anchor="middle" class="m s">container</text>
      <rect x="872" y="568" width="78" height="54" rx="6" fill="#FFFFFF" stroke="#E2C08A"/>
      <text x="911" y="586" text-anchor="middle" class="t s">shop-queue</text>
      <text x="911" y="602" text-anchor="middle" class="m s">system</text>
      <text x="911" y="615" text-anchor="middle" class="m s">container</text>
      <rect x="960" y="568" width="78" height="54" rx="6" fill="#FFFFFF" stroke="#E2C08A" stroke-dasharray="4 3"/>
      <text x="999" y="599" text-anchor="middle" class="m s">free</text>
      <rect x="784" y="642" width="150" height="38" fill="url(#pl-green-body)"/>
      <ellipse cx="859" cy="680" rx="75" ry="8" fill="#2F8A57"/>
      <ellipse cx="859" cy="642" rx="75" ry="8" fill="#9BDAB4"/>
      <text x="859" y="667" text-anchor="middle" class="w s">local: disks, volumes</text>
      <rect x="950" y="642" width="88" height="38" fill="url(#pl-green-body)" fill-opacity="0.75"/>
      <ellipse cx="994" cy="680" rx="44" ry="8" fill="#2F8A57" fill-opacity="0.75"/>
      <ellipse cx="994" cy="642" rx="44" ry="8" fill="#9BDAB4"/>
      <text x="994" y="667" text-anchor="middle" class="w s">backup</text>
    </g>

    <!-- Shared pool across the servers -->
    <g id="pl-shared">
      <rect x="144" y="722" width="912" height="38" rx="10" fill="#F0FAF4" stroke="#8FD0AA" stroke-dasharray="5 4"/>
      <text x="600" y="746" text-anchor="middle" class="t s">shared pool: clustered LVM on a SAN, reached by every server (running in the lab; Apelora places nothing on it yet)</text>
    </g>

    <!-- OVN across the servers -->
    <g id="pl-ovn">
      <rect x="144" y="774" width="912" height="40" rx="20" fill="url(#pl-blue)"/>
      <text x="600" y="799" text-anchor="middle" class="w b">OVN: a network per application, access rules between modules, service addresses</text>
    </g>
  </g>

  <!-- Physical servers -->
  <g id="pl-hardware">
    <path class="line" d="M289 830 V854 M600 830 V854 M911 830 V854"/>
    <g>
      <ellipse cx="289" cy="904" rx="110" ry="8" fill="url(#pl-floor)"/>
      <rect x="199" y="854" width="180" height="44" rx="5" fill="url(#pl-metal)" stroke="#7C8592"/>
      <rect x="211" y="864" width="112" height="24" rx="2" fill="#4B5563"/>
      <path d="M223 868 V884 M235 868 V884 M247 868 V884 M259 868 V884 M271 868 V884 M283 868 V884 M295 868 V884 M307 868 V884" stroke="#9AA2AE" stroke-width="4"/>
      <circle cx="355" cy="876" r="4" fill="#3FB27F"/>
    </g>
    <g>
      <ellipse cx="600" cy="904" rx="110" ry="8" fill="url(#pl-floor)"/>
      <rect x="510" y="854" width="180" height="44" rx="5" fill="url(#pl-metal)" stroke="#7C8592"/>
      <rect x="522" y="864" width="112" height="24" rx="2" fill="#4B5563"/>
      <path d="M534 868 V884 M546 868 V884 M558 868 V884 M570 868 V884 M582 868 V884 M594 868 V884 M606 868 V884 M618 868 V884" stroke="#9AA2AE" stroke-width="4"/>
      <circle cx="666" cy="876" r="4" fill="#3FB27F"/>
    </g>
    <g>
      <ellipse cx="911" cy="904" rx="110" ry="8" fill="url(#pl-floor)"/>
      <rect x="821" y="854" width="180" height="44" rx="5" fill="url(#pl-metal)" stroke="#7C8592"/>
      <rect x="833" y="864" width="112" height="24" rx="2" fill="#4B5563"/>
      <path d="M845 868 V884 M857 868 V884 M869 868 V884 M881 868 V884 M893 868 V884 M905 868 V884 M917 868 V884 M929 868 V884" stroke="#9AA2AE" stroke-width="4"/>
      <circle cx="977" cy="876" r="4" fill="#3FB27F"/>
    </g>
    <path class="line" d="M289 912 V942 H911 V912 M600 912 V942"/>
    <text x="600" y="966" text-anchor="middle" class="m b">Physical Linux servers on your network (Lima VMs stand in for them in the lab): the uplink, the cluster links, the service address range</text>
  </g>
</svg>
