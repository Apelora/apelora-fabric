[package]
name = "apelora-incus-adapter"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# Exposes IncusClient::plain_for_tests for other crates' tests. Never enable in release builds.
test-util = []

[dependencies]
apelora-domain = { version = "0.0.0", path = "../domain" }
# Join tokens are base64-encoded JSON (Incus's format); already in the tree via reqwest/rustls.
base64 = "0.22.1"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
rustls-pki-types = { version = "1.15.1", features = ["std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.0", features = ["macros", "rt"] }
webpki = { version = "0.103.15", package = "rustls-webpki" }

[dev-dependencies]
axum = "0.8.9"
rcgen = "0.14.7"
rustls = "0.23.46"
tokio = { version = "1.54.0", features = ["macros", "rt-multi-thread", "net"] }
tokio-rustls = "0.26.6"
