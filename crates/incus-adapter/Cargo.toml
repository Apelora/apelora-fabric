[package]
name = "apelora-incus-adapter"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# Exposes IncusClient::plain_for_tests for other crates' tests. Never enable in release builds.
test-util = []

[dependencies]
apelora-domain = { version = "0.0.0", path = "../domain" }
# Request counts, latency and reachability per endpoint template (no dependencies of its own).
apelora-metrics = { version = "0.0.0", path = "../metrics" }
# Join tokens are base64-encoded JSON (Incus's format); already in the tree via reqwest/rustls.
base64 = "0.22.1"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
# The websocket channel to an exec session (Incus returns its address from the exec call): TLS is
# done by hand so it uses exactly the pinned-certificate rules of the HTTP client.
futures-util = { version = "0.3.32", default-features = false, features = ["sink", "std"] }
rustls = { version = "0.23.46", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
rustls-pki-types = { version = "1.15.1", features = ["std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["macros", "rt", "net", "sync", "time"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["aws_lc_rs"] }
tokio-tungstenite = { version = "0.29.0", default-features = false, features = ["handshake"] }
# Debug lines per Incus request and warnings for failed operations; the same version the
# services use (MIT).
tracing = "0.1.44"
webpki = { version = "0.103.16", package = "rustls-webpki" }
# Reads certificate validity (expiry warnings); already in the tree via rcgen (MIT OR Apache-2.0).
x509-parser = { version = "0.18.1", default-features = false }

[dev-dependencies]
axum = "0.8.9"
rcgen = "0.14.10"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "net"] }
