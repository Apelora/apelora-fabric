[package]
name = "apelora-telemetry"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# Shared logging (text or JSON) and optional OTLP/HTTP traces for both services.
# reqwest is already in the tree (control plane, worker, Incus adapter); Apache-2.0 OR MIT.
[dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
serde_json = "1.0.154"
sha2 = "0.11.0"
tokio = { version = "1.54.1", features = ["sync"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }

[lints]
workspace = true

[dev-dependencies]
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }
