[package]
name = "apelora-persistence"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
getrandom = "0.4.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.0"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "postgres", "migrate", "macros", "uuid", "json", "time"] }
thiserror = "2.0.21"
time = { version = "0.3.47", features = ["serde-well-known"] }
uuid = { version = "1.26.1", features = ["v4", "serde"] }

[lints]
workspace = true

[dev-dependencies]
tokio = { version = "1.54.0", features = ["macros", "rt-multi-thread"] }
