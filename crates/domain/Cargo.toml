[package]
name = "apelora-domain"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
# Already in the workspace (persistence, worker, control plane): names of scheduled snapshots and backups.
time = "0.3.47"
utoipa = { version = "5.5.0", optional = true }

[dev-dependencies]
serde_json = "1.0.154"
time = { version = "0.3.47", features = ["macros"] }

[features]
utoipa = ["dep:utoipa"]
