[package]
name = "apelora-domain"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
# Reads the backup scripts' JSON records (already in the workspace).
serde_json = "1.0.154"
# Already in the workspace (persistence, worker, control plane): names of scheduled snapshots and backups.
time = { version = "0.3.47", features = ["parsing"] }
# Already in the workspace (persistence, worker, control plane): what an instance was built from.
sha2 = "0.11.0"
utoipa = { version = "5.5.0", optional = true }

[dev-dependencies]
time = { version = "0.3.47", features = ["macros", "formatting"] }

[features]
utoipa = ["dep:utoipa"]
