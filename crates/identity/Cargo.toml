[package]
name = "apelora-identity"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# Already in the workspace (incus-adapter): reading a token's issuer before choosing its verifier.
base64 = "0.22.1"
jsonwebtoken = { version = "10", default-features = false, features = ["aws_lc_rs"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.0", features = ["sync", "time"] }

[dev-dependencies]
jsonwebtoken = { version = "10", default-features = false, features = ["aws_lc_rs", "use_pem"] }
base64 = "0.22.1"
rcgen = "0.14.7"
tokio = { version = "1.54.0", features = ["macros", "rt-multi-thread"] }
