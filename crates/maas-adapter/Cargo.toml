[package]
name = "apelora-maas-adapter"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# A read-and-power client of the MAAS REST API (ADR 0002, docs/design/provisioner-maas.md).
# Nothing here is new to the tree: the HTTP client, serde and uuid are the ones the services use.
[lints]
workspace = true

[dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
time = "0.3.47"
tokio = { version = "1.54.1", features = ["time"] }
uuid = { version = "1.26.1", features = ["v4"] }

[dev-dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio"] }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "net"] }
