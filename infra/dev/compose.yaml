# Local development services. Development credentials only; never reuse them anywhere else.
# Start:  docker compose -f infra/dev/compose.yaml up -d
# Stop:   docker compose -f infra/dev/compose.yaml down        (add -v to delete the data)
name: apelora-dev
services:
  db:
    image: postgres:18-alpine
    container_name: apelora-dev-db
    environment:
      POSTGRES_USER: apelora
      POSTGRES_PASSWORD: apelora-dev-only
      POSTGRES_DB: apelora
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - apelora-dev-db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apelora -d apelora"]
      interval: 2s
      timeout: 2s
      retries: 30
  # Optional: an OpenID Connect provider for trying sign-in (see dex.yaml). Started only with --profile oidc.
  oidc:
    image: ghcr.io/dexidp/dex:v2.41.1
    container_name: apelora-dev-oidc
    profiles: ["oidc"]
    command: ["dex", "serve", "/etc/dex/config.yaml"]
    ports:
      - "127.0.0.1:5556:5556"
    volumes:
      - ./dex.yaml:/etc/dex/config.yaml:ro
volumes:
  apelora-dev-db: {}
