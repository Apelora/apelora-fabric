# Local development services. Development credentials only; never reuse them anywhere else.
# Start:  docker compose -f infra/dev/compose.yaml up -d
# Stop:   docker compose -f infra/dev/compose.yaml down        (add -v to delete the data)
name: apelora-dev
services:
  db:
    image: postgres:18-alpine
    container_name: apelora-dev-db
    environment:
      POSTGRES_USER: apelora
      POSTGRES_PASSWORD: apelora-dev-only
      POSTGRES_DB: apelora
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - apelora-dev-db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apelora -d apelora"]
      interval: 2s
      timeout: 2s
      retries: 30
  # Optional: an OpenID Connect provider for trying sign-in (see dex.yaml). Started only with --profile oidc.
  oidc:
    image: ghcr.io/dexidp/dex:v2.46.1
    container_name: apelora-dev-oidc
    profiles: ["oidc"]
    command: ["dex", "serve", "/etc/dex/config.yaml"]
    ports:
      - "127.0.0.1:5556:5556"
    volumes:
      - ./dex.yaml:/etc/dex/config.yaml:ro
  # Optional: an LDAP directory (TLS) for trying directory sign-in. Started only with
  # --profile directory, after `bash infra/dev/directory/make-certs.sh` (git-ignored keys).
  # People and the development password: infra/dev/directory/seed.ldif. In the Fabric Console
  # (Identity & Access → Sign-in → Directories): ldaps://localhost:1636 with the CA in
  # infra/dev/directory/certs/ca.pem, bind name uid={username},ou=people,dc=apelora,dc=test.
  directory:
    build: ./directory
    image: apelora-dev-directory:local
    container_name: apelora-dev-directory
    profiles: ["directory"]
    ports:
      - "127.0.0.1:1636:636"
      - "127.0.0.1:1389:389"
    volumes:
      - ./directory/certs:/certs:ro
volumes:
  apelora-dev-db: {}
