# Development directory for Apelora's directory sign-in. Development only.
#
# - TLS on 636 (ldaps) and StartTLS on 389; a simple bind without TLS is refused (security).
# - Nobody can bind as an administrator: the rootdn has no password. The seed is loaded offline
#   (slapadd) when the container starts with an empty database.
# - People may read their own entry and, once signed in, the groups: exactly what Apelora needs
#   when it binds as the person.
include     /etc/openldap/schema/core.schema
include     /etc/openldap/schema/cosine.schema
include     /etc/openldap/schema/inetorgperson.schema
include     /etc/openldap/schema/nis.schema

pidfile     /run/openldap/slapd.pid
argsfile    /run/openldap/slapd.args

modulepath  /usr/lib/openldap
moduleload  back_mdb.so
moduleload  memberof.so

TLSCACertificateFile    /etc/apelora-directory/tls/ca.pem
TLSCertificateFile      /etc/apelora-directory/tls/server.pem
TLSCertificateKeyFile   /etc/apelora-directory/tls/server.key
# TLS 1.2 or later.
TLSProtocolMin          3.3

# A simple bind needs an encrypted connection (ldaps:// or StartTLS).
security    simple_bind=64

database    mdb
maxsize     104857600
suffix      "dc=apelora,dc=test"
rootdn      "cn=nobody,dc=apelora,dc=test"
directory   /var/lib/openldap/apelora
index       objectClass eq
index       uid,member,memberOf eq

overlay     memberof
memberof-group-oc       groupOfNames
memberof-member-ad      member
memberof-memberof-ad    memberOf
memberof-refint         TRUE

access to attrs=userPassword
    by self =w
    by anonymous auth
    by * none
access to dn.base="ou=people,dc=apelora,dc=test"
    by users search
    by * none
access to dn.subtree="ou=people,dc=apelora,dc=test"
    by self read
    by * none
access to dn.subtree="ou=groups,dc=apelora,dc=test"
    by users read
    by * none
access to *
    by users search
    by * none
