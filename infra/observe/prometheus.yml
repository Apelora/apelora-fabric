# Scrapes Apelora's loopback metrics listeners (APELORA_METRICS_ADDR, worker default).
# Incus /1.0/metrics stays on each member with a metrics-only certificate (metrics.sh).
global:
  scrape_interval: 15s
  evaluation_interval: 15s
scrape_configs:
  - job_name: apelora-control-plane
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:9470"]
        labels:
          component: control-plane
  - job_name: apelora-worker
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:9471"]
        labels:
          component: worker
  - job_name: prometheus
    static_configs:
      - targets: ["127.0.0.1:9090"]
