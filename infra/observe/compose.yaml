# Example collector the operator runs *inside* the installation (docs/architecture/MONITORING.md).
# Development credentials only; never reuse them anywhere else. Binds loopback only.
# Start:  bash scripts/test-cluster/observe.sh
# Stop:   docker compose -f infra/observe/compose.yaml down
name: apelora-observe
services:
  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: apelora-observe-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=2d
      - --web.enable-lifecycle
      - --web.enable-remote-write-receiver
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"
  loki:
    image: grafana/loki:3.5.5
    container_name: apelora-observe-loki
    command: ["-config.file=/etc/loki/loki.yml"]
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - ./loki.yml:/etc/loki/loki.yml:ro
      - loki:/loki
  tempo:
    image: grafana/tempo:2.8.2
    container_name: apelora-observe-tempo
    command: ["-config.file=/etc/tempo/tempo.yml"]
    ports:
      - "127.0.0.1:3200:3200"
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
    volumes:
      - ./tempo.yml:/etc/tempo/tempo.yml:ro
      - tempo:/var/tempo
  pyroscope:
    image: grafana/pyroscope:1.14.0
    container_name: apelora-observe-pyroscope
    ports:
      - "127.0.0.1:4040:4040"
    volumes:
      - pyroscope:/data
  alloy:
    image: grafana/alloy:v1.10.2
    container_name: apelora-observe-alloy
    command:
      - run
      - /etc/alloy/config.alloy
      - --storage.path=/var/lib/alloy
    ports:
      - "127.0.0.1:12345:12345"
    volumes:
      - ./config.alloy:/etc/alloy/config.alloy:ro
      - ${APELORA_OBSERVE_LOG_DIR:-/tmp/apelora-logs}:/var/log/apelora:ro
      - alloy:/var/lib/alloy
    depends_on:
      - loki
  grafana:
    image: grafana/grafana:12.2.0
    container_name: apelora-observe-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: apelora-dev-only
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SERVER_ROOT_URL: http://127.0.0.1:3000
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/apelora-overview.json
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
      - tempo
      - pyroscope
volumes:
  prometheus: {}
  loki: {}
  tempo: {}
  pyroscope: {}
  alloy: {}
  grafana: {}
