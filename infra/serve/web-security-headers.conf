#
# Response headers for the built Studio and Fabric Console (static files). Included by
# apelora.conf in every location that serves them. The API sets its own, stricter headers.
#
# The policy allows only this origin: scripts, styles and fonts from the built bundle, images from
# the bundle or inlined as data: URIs (small catalogue logos), and requests, including the terminal
# websocket, to the same origin. Nothing is loaded from anywhere else, so the applications work
# without internet access. tests/e2e/web-serving.spec.ts loads both applications under exactly
# this policy and fails on any violation or any request that leaves the origin.
#
# Two settings per site, made with `set` in apelora.conf:
#
# $apelora_sign_in_origins: identity providers people sign in with. The browser fetches their
#   discovery document and exchanges the sign-in code with them directly, so their origins must be
#   allowed for connections. Empty when only API tokens are used.
# $apelora_style_elements: the Studio's terminal emulator writes its colours and cell sizes into
#   <style> elements at run time, which a policy can allow only with 'unsafe-inline' for style
#   elements. The Studio sets it to 'unsafe-inline'; the Console needs nothing and leaves it empty.
#   Scripts, style attributes and everything else stay limited to this origin either way.
add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; style-src-elem 'self' $apelora_style_elements; img-src 'self' data:; font-src 'self'; connect-src 'self' $apelora_sign_in_origins; manifest-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'; object-src 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header X-Frame-Options "DENY" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Strict-Transport-Security "max-age=31536000" always;
