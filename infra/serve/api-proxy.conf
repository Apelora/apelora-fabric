#
# /api/ to the Apelora control plane. Included by apelora.conf in each application's site.
# The control plane sends its own security headers (nosniff, no-referrer, frame denial, a
# content security policy that allows nothing, Cache-Control: no-store); only HSTS is added here,
# since TLS ends at this proxy.

location /api/ {
    proxy_pass http://apelora_api;
    proxy_http_version 1.1;

    # The browser's host: the control plane compares it with the Origin of terminal websockets.
    proxy_set_header Host $host;
    # Replace, never append: the client cannot add addresses of its own. The control plane trusts
    # this header only from addresses in APELORA_TRUSTED_PROXIES.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;

    # Terminal sessions (websockets) last up to APELORA_CONSOLE_MAX_SECS (default one hour).
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $apelora_connection;
    proxy_read_timeout 3700s;
    proxy_send_timeout 3700s;

    # Answers are per caller; never keep them here.
    proxy_buffering off;
    proxy_cache off;
    client_max_body_size 4m;

    add_header Strict-Transport-Security "max-age=31536000" always;
}
