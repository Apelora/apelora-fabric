# SPDX-License-Identifier: AGPL-3.0-only
#
# Example: one TLS-terminating reverse proxy (NGINX syntax) in front of the Apelora control plane,
# serving the built Studio and Fabric Console (`npm run build`: apps/studio/dist and
# apps/fabric-console/dist) as static files. Each application gets its own host name, and each
# host passes /api/ to the control plane, so the browser talks to one origin only (no CORS, the
# terminal's same-origin check holds, nothing is fetched from elsewhere).
#
# Adapt the host names, certificate paths and directories; keep the headers. Install the two
# snippets next to this file under /etc/apelora/serve/.
#
# The control plane behind it, either
#   - on the same host:   APELORA_API_ADDR=127.0.0.1:8080 (plain HTTP on loopback is allowed), or
#   - on another host:    APELORA_API_ADDR=0.0.0.0:8080 APELORA_BEHIND_PROXY=1
#                         APELORA_TRUSTED_PROXIES=<this proxy's address>
#     and a firewall that lets only this proxy reach port 8080.
# With APELORA_TRUSTED_PROXIES set, the control plane's per-address rate limits count each
# browser by the address this proxy forwards; without it, every browser shares the proxy's.

upstream apelora_api {
    server 127.0.0.1:8080;
    keepalive 16;
}

# Terminal sessions are websockets: pass the upgrade through, keep plain requests keep-alive.
map $http_upgrade $apelora_connection {
    default upgrade;
    ""      "";
}

# Plain HTTP only redirects.
server {
    listen 80;
    listen [::]:80;
    server_name studio.example.internal console.example.internal;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name studio.example.internal;
    ssl_certificate     /etc/apelora/tls/studio.example.internal.crt;
    ssl_certificate_key /etc/apelora/tls/studio.example.internal.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Identity provider origins people sign in with, space separated, e.g. "https://id.example.internal".
    set $apelora_sign_in_origins "";
    # The terminal emulator's <style> elements (see web-security-headers.conf).
    set $apelora_style_elements "'unsafe-inline'";

    root /srv/apelora/studio;
    include /etc/apelora/serve/api-proxy.conf;

    # Built files carry a content hash in their name: cache them for good.
    location /assets/ {
        include /etc/apelora/serve/web-security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Everything else is the application (client-side routes such as /studio/applications/...).
    location / {
        include /etc/apelora/serve/web-security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name console.example.internal;
    ssl_certificate     /etc/apelora/tls/console.example.internal.crt;
    ssl_certificate_key /etc/apelora/tls/console.example.internal.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    set $apelora_sign_in_origins "";
    set $apelora_style_elements "";

    root /srv/apelora/console;
    include /etc/apelora/serve/api-proxy.conf;

    location /assets/ {
        include /etc/apelora/serve/web-security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location / {
        include /etc/apelora/serve/web-security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
